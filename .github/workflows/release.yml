name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: cvworkbench-production
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}
  PUBLIC_API_BASE_URL: https://cvworkbench.com
  PUBLIC_SITE_URL: https://cvworkbench.com
  PUBLIC_LINKEDIN_ENABLED: "false"
  PUBLIC_PREVIEW_MODE: backend
  PUBLIC_GOOGLE_TAG_ID: G-M3EY6389QN
  IMAGE_NAMESPACE: ghcr.io/katsuotz/generate-kit
  WORKER_RUNTIME_TAG: v1

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

  build-frontend:
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check frontend
        run: bun run --cwd frontend check

      - name: Lint frontend
        run: bun run --cwd frontend lint

      - name: Test frontend
        run: bun run --cwd frontend test

      - name: Build production frontend
        run: bun run --cwd frontend build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend image
        run: docker build --tag "$IMAGE_NAMESPACE/frontend:$RELEASE_TAG" --file deploy/frontend.Dockerfile .

      - name: Push frontend image
        run: docker push "$IMAGE_NAMESPACE/frontend:$RELEASE_TAG"

  validate-backend:
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Check backend formatting
        run: cargo fmt --manifest-path backend/Cargo.toml -- --check

      - name: Check backend
        run: cargo check --manifest-path backend/Cargo.toml --locked --all-targets

      - name: Test backend
        run: cargo test --manifest-path backend/Cargo.toml --locked

  build-api:
    needs: validate-backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        shell: bash
        run: |
          set -euo pipefail
          image="$IMAGE_NAMESPACE/api:$RELEASE_TAG"
          docker build --target api --tag "$image" --file backend/Dockerfile backend
          docker push "$image"

  build-worker:
    needs: validate-backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare worker runtime image
        shell: bash
        run: |
          set -euo pipefail
          runtime_image="$IMAGE_NAMESPACE/worker-runtime:$WORKER_RUNTIME_TAG"
          if ! docker pull "$runtime_image"; then
            docker build --tag "$runtime_image" --file backend/worker-runtime.Dockerfile backend
            docker push "$runtime_image"
          fi

      - name: Build and push worker image
        shell: bash
        run: |
          set -euo pipefail
          runtime_image="$IMAGE_NAMESPACE/worker-runtime:$WORKER_RUNTIME_TAG"
          image="$IMAGE_NAMESPACE/worker:$RELEASE_TAG"
          docker build \
            --target worker \
            --build-arg WORKER_RUNTIME_IMAGE="$runtime_image" \
            --tag "$image" \
            --file backend/Dockerfile \
            backend
          docker push "$image"

  prepare-deployment:
    needs: [build-frontend, build-api, build-worker]
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Configure deployment SSH
        shell: bash
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_PRIVATE_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Stage deployment configuration
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          scp -q -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            -i "$HOME/.ssh/id_ed25519" \
            deploy/compose.production.yaml \
            deploy/nginx-cvworkbench.conf \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/"

      - name: Log in deployment server to GHCR
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$GHCR_USERNAME"
          test -n "$GHCR_TOKEN"
          printf '%s' "$GHCR_TOKEN" | ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            -i "$HOME/.ssh/id_ed25519" \
            "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

      - name: Prepare release configuration
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            -i "$HOME/.ssh/id_ed25519" \
            "$DEPLOY_USER@$DEPLOY_HOST" "RELEASE_TAG='$RELEASE_TAG' bash -s" <<'REMOTE'
          set -euo pipefail

          app_dir=/opt/cvworkbench
          compose_file="$app_dir/compose.production.yaml"
          compose_next="$app_dir/compose.production.yaml.next"
          nginx_site=/etc/nginx/sites-available/cvworkbench
          nginx_next=/etc/nginx/sites-available/cvworkbench.next
          compose_archive=/tmp/compose.production.yaml
          nginx_archive=/tmp/nginx-cvworkbench.conf

          test -d "$app_dir"
          test -f "$compose_file"
          test -f "$app_dir/.env"
          test "$(stat -c '%a' "$app_dir/.env")" = 600
          grep -q '^COOKIE_SECURE=true$' "$app_dir/.env"
          test -f "$nginx_site"
          test -f "$compose_archive"
          test -f "$nginx_archive"

          install -m 644 "$compose_archive" "$compose_next"
          install -m 644 "$nginx_archive" "$nginx_next"
          rm -f "$compose_archive" "$nginx_archive"
          mv -f "$compose_next" "$compose_file"

          set_env_value() {
            key="$1"
            value="$2"
            if grep -q "^${key}=" "$app_dir/.env"; then
              sed -i "s|^${key}=.*|${key}=${value}|" "$app_dir/.env"
            else
              printf '%s=%s\n' "$key" "$value" >> "$app_dir/.env"
            fi
          }

          set_env_value API_IMAGE ghcr.io/katsuotz/generate-kit/api
          set_env_value WORKER_IMAGE ghcr.io/katsuotz/generate-kit/worker
          set_env_value FRONTEND_IMAGE ghcr.io/katsuotz/generate-kit/frontend
          set_env_value FRONTEND_PORT 18731
          set_env_value RELEASE_TAG "$RELEASE_TAG"
          chmod 600 "$app_dir/.env"

          cd "$app_dir"
          docker compose -f "$compose_file" config --quiet
          REMOTE

  deploy-frontend:
    needs: prepare-deployment
    runs-on: ubuntu-latest
    steps:
      - name: Configure deployment SSH
        shell: bash
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_PRIVATE_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Deploy frontend
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            -i "$HOME/.ssh/id_ed25519" \
            "$DEPLOY_USER@$DEPLOY_HOST" "RELEASE_TAG='$RELEASE_TAG' bash -s" <<'REMOTE'
          set -euo pipefail

          app_dir=/opt/cvworkbench
          compose_file="$app_dir/compose.production.yaml"
          nginx_site=/etc/nginx/sites-available/cvworkbench
          nginx_next=/etc/nginx/sites-available/cvworkbench.next
          nginx_backup=/etc/nginx/sites-available/cvworkbench.previous
          lock_file="$app_dir/.deploy.lock"

          cd "$app_dir"
          docker pull "ghcr.io/katsuotz/generate-kit/frontend:$RELEASE_TAG"
          (
            flock 9
            docker compose -f "$compose_file" up -d --no-build frontend
          ) 9>"$lock_file"

          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:18731/; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              exit 1
            fi
            sleep 2
          done

          (
            flock 9
            cp -a "$nginx_site" "$nginx_backup"
            mv -f "$nginx_next" "$nginx_site"
            if ! nginx -t; then
              mv -f "$nginx_backup" "$nginx_site"
              nginx -t
              exit 1
            fi
            systemctl reload nginx
            rm -f "$nginx_backup"
          ) 9>"$lock_file"

          docker compose -f "$compose_file" ps frontend
          REMOTE

  deploy-backend:
    needs: prepare-deployment
    runs-on: ubuntu-latest
    steps:
      - name: Configure deployment SSH
        shell: bash
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_PRIVATE_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Deploy backend
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            -i "$HOME/.ssh/id_ed25519" \
            "$DEPLOY_USER@$DEPLOY_HOST" "RELEASE_TAG='$RELEASE_TAG' bash -s" <<'REMOTE'
          set -euo pipefail

          app_dir=/opt/cvworkbench
          compose_file="$app_dir/compose.production.yaml"
          lock_file="$app_dir/.deploy.lock"

          cd "$app_dir"
          docker pull "ghcr.io/katsuotz/generate-kit/api:$RELEASE_TAG" &
          api_pull=$!
          docker pull "ghcr.io/katsuotz/generate-kit/worker:$RELEASE_TAG" &
          worker_pull=$!
          wait "$api_pull"
          wait "$worker_pull"
          (
            flock 9
            docker compose -f "$compose_file" up -d --no-build api worker
          ) 9>"$lock_file"

          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:18732/health/live && \
              curl -fsS -o /dev/null http://127.0.0.1:18732/health/ready && \
              worker_id="$(docker compose -f "$compose_file" ps -q worker)" && \
              [ -n "$worker_id" ] && \
              [ "$(docker inspect --format '{{.State.Status}}' "$worker_id")" = running ]; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              exit 1
            fi
            sleep 2
          done

          docker compose -f "$compose_file" ps api worker
          REMOTE

  verify-public-deployment:
    needs: [deploy-frontend, deploy-backend]
    if: ${{ needs.deploy-frontend.result == 'success' && needs.deploy-backend.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify public deployment
        run: |
          curl --fail --silent --show-error --output /dev/null https://cvworkbench.com/
          curl --fail --silent --show-error --output /dev/null https://cvworkbench.com/health/live

  cleanup-deployment:
    if: ${{ always() }}
    needs: [deploy-frontend, deploy-backend, verify-public-deployment]
    runs-on: ubuntu-latest
    steps:
      - name: Configure deployment SSH
        shell: bash
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_PRIVATE_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Log out deployment server from GHCR
        continue-on-error: true
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            -i "$HOME/.ssh/id_ed25519" \
            "$DEPLOY_USER@$DEPLOY_HOST" 'docker logout ghcr.io >/dev/null 2>&1 || true'
