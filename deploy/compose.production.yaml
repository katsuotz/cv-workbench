name: cvworkbench

services:
  postgres:
    image: postgres:19beta3-bookworm
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - cvworkbench-postgres19beta3:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - private

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/katsuotz/generate-kit/frontend}:${RELEASE_TAG}
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-18731}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - private

  api:
    image: ${API_IMAGE:-ghcr.io/katsuotz/generate-kit/api}:${RELEASE_TAG}
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BIND_ADDR: 0.0.0.0:18732
      LATEX_COMPILER_ENABLED: "false"
    ports:
      - "127.0.0.1:${API_PORT:-18732}:18732"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:18732/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - private

  worker:
    image: ${WORKER_IMAGE:-ghcr.io/katsuotz/generate-kit/worker}:${RELEASE_TAG}
    restart: unless-stopped
    init: true
    mem_limit: 1536m
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LATEX_COMPILER_ENABLED: "true"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - private

networks:
  private:
    driver: bridge

volumes:
  cvworkbench-postgres19beta3:
